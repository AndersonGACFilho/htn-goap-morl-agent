[project]
name = "HTN-GOAP-MORL-Planner"
version = "0.1.0"
description = """
A research prototype for a hybrid agent architecture that combines
Hierarchical Task Network planning, GOAP-inspired tactical reasoning,
and multi-objective reinforcement learning.

The system separates decision-making into three layers: HTN defines
long-term goals and decomposes them into subtasks, the GOAP-inspired
layer configures tactical priorities and intentions, and the MORL layer
selects one symbolically valid HTN decomposition method according to
multiple learned objectives.

The goal is to investigate how symbolic planning and reinforcement
learning can be integrated to produce agents with interpretable planning,
adaptive execution, and real-time decision-making.
"""
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "torch",
    "gymnasium",
    "matplotlib",
    "pydantic",
    "pytest",
    "black",
    "flake8",
    "pygame",
    "ruff",
    "mypy",
    "pre-commit",
    "rich>=15.0.0",
    "cairosvg>=2.9.0",
    "svglib>=2.1.0",
    "reportlab>=5.0.0",
    "pillow>=12.3.0",
    "resvg-py>=0.3.4",
    "latexmk>=0.0.2",
    "mkdocs>=1.6.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[dependency-groups]
docs = [
    "mkdocs-material>=9.7.0",
]
